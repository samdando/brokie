<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Brokie · local simulated preview</title></head><body><div id="root"></div><script type="module">
// Local QA only. No credentials, network accounts, messages or orders.
import { game } from '/src/game.ts';

const now=Date.parse('2026-10-31T04:00:00Z'),stamp=new Date(now).toISOString(),start=Math.floor(now/60000)-160;

 const unit=p*.00045;let last=p-50*unit;
 return [m,Array.from({length:160},(_,i)=>{
  const open=last;let close=p+unit*(Math.sin(i*.13)*10+Math.sin(i*.41)*3+(i-160)*.28);
  if(i>=139&&i<=142)close+=unit*(i-138)*3.7;
  if(i>=143&&i<=147)close+=unit*(148-i)*3.7;
  if(i===157)close=open-unit*1.6;
  if(i===158)close=open+unit*4.8;
  const wick=unit*(.3+Math.abs(Math.sin(i*2.7))*.8);last=close;
  return {index:start+i,open,high:Math.max(open,close)+wick,low:Math.min(open,close)-wick*.7,close};
 })];
}));

game.api.rpc=async(n,a)=>{
 if(n==='player_avatars')return Object.fromEntries((a?.p_handles??[]).map((h,i)=>[h,{symbol:({'sam':'👽','bum':'🐸','jaoushai':'💎','ankits':'😎'})[h]??null,color:({'sam':'#B5A0FE','bum':'#73E7C3','jaoushai':'#7CC8FF','ankits':'#F2CA73'})[h]??null}]));
 if(n==='squad_dashboard')return dashboard;
 if(n==='daily_leaderboard')return {day:'2026-10-30',today:'2026-10-30',rows:dashboard.players};
 if(n==='daily_receipts')return [trade];
 if(n==='avatar_shop')return {balance:8,equipped:null,items:[],color:'#B5A0FE'};
 if(n==='lifetime_stats')return {...lifetime,handle:a?.p_handle??'sam'};
 if(n==='review_trade')return {trade,candles:candles.btc.slice(-40),bucket_seconds:60,note:''};
 if(n==='chart_bubbles')return [];
 if(n==='set_position_bracket'){
  const p=game.state.me.positions.find(p=>p.id===a.p_position);
  if(!p)throw new Error('This position is already closed.');
  const q=game.quote(p.market).price,tick=MARKETS[p.market].tick;
  const level=a.p_price==null?null:Math.round(a.p_price/tick)*tick;
  const below=(a.p_kind==='tp'&&p.side==='short')||(a.p_kind==='sl'&&p.side==='long');
  if(level!=null&&(!Number.isFinite(level)||level<=0))throw new Error('Choose a valid price.');
  if(level!=null&&(below?level>=q:level<=q))throw new Error('Price has already crossed that level. Stop was not saved.');
  const key=a.p_kind==='tp'?'take_profit':'stop_loss';
  return {positions:game.state.me.positions.filter(x=>x.market===p.market&&x.side===p.side).map(x=>({id:x.id,stop_loss:x.stop_loss??null,take_profit:x.take_profit??null,[key]:level}))};
 }
 throw new Error('Not available in the local preview.');
};

game.closeStack=async(ids)=>{const positions=game.state.me.positions;let pnl=0;for(const p of positions.filter(p=>ids.includes(p.id)))pnl+=pnlOf(p,game.quote(p.market).price);game.set({me:{...game.state.me,cash:game.state.me.cash+pnl,positions:positions.filter(p=>!ids.includes(p.id))}});return {pnl};};

await import('/src/main.tsx');
</script></body></html>
